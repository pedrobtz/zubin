# Design 17: tools/run-benchmarks on a Linux x86-64 runner, for the numbers in
# .agents/benchmarks.md. Not a gate: by hand, and on pull requests that
# change the benchmarks themselves.
on:
  workflow_dispatch:
  pull_request:
    paths: [tools/benchmarks.R, tools/run-benchmarks, .github/workflows/benchmarks.yaml]

name: benchmarks

permissions: read-all

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Run the benchmarks
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)' || true
          tools/run-benchmarks | tee benchmarks.txt
      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: benchmarks.txt
