on:
  push:
    branches: [main, master]
    paths-ignore:
      - ".github/badges/coverage.svg"
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@26e45df7fdb1d57c083bad840b1dadc7ac78565b # v1.20.0
    with:
      # gcov line and branch coverage of src/ and the headers it includes
      native: true
    permissions:
      contents: write
