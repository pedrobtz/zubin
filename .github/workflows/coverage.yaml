on:
  push:
    branches: [main, master]
    paths-ignore:
      - ".github/badges/coverage.svg"
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@8caf5119301bb2a3bd433b92045b8c75b3097096 # v1.24.0
    with:
      # gcov line and branch coverage of src/ and the headers it includes.
      # Both jobs run without NOT_CRAN, so the skip_on_cran() tests (memory
      # errors, interrupts) are not in either number.
      native: true
    permissions:
      contents: write
