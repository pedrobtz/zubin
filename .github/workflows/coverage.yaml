on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "15 18 * * 6"
  workflow_dispatch:
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@4062705ecc3560e85ec8045b30d0e9951fa447a2 # v1.30.0
    with:
      # gcov line and branch coverage of src/ and the headers it includes.
      # Both jobs run without NOT_CRAN, so the skip_on_cran() tests (memory
      # errors, interrupts) are not in either number.
      native: true
    permissions:
      contents: write
